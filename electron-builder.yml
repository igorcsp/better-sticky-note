appId: com.igorcordeiro.better-sticky-notes
productName: Better Sticky Notes
copyright: Copyright © 2025 Igor Pereira

directories:
  output: dist

files:
  - out/**/*
  - package.json

win:
  target: nsis
  icon: build/icon.ico

nsis:
  oneClick: true
  perMachine: false

mac:
  target: dmg
  icon: build/icon.icns
  category: public.app-category.productivity

linux:
  target: AppImage
  icon: build/icon.png
  category: Utility

publish:
  provider: github
  owner: igorcsp
  repo: better-sticky-note
  releaseType: release
